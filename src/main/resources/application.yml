spring:
  profiles:
    active: dev

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    show-sql: true

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: ${RABBITMQ_VHOST:nuvibe}
    # 일단은 dlq 없이
    listener:
      type: simple
      simple:
        acknowledge-mode: auto
        default-requeue-rejected: false
        prefetch: 1
        retry:
          enabled: false


  cloud:
    aws:
      credentials:
        access-key: ${S3_ACCESS_KEY} # AWS에서 MinIO 전용 키로 대체
        secret-key: ${S3_SECRET_KEY}
      region:
        static: ${S3_REGION:us-east-1}
      s3:
        bucket: ${S3_BUCKET}
        endpoint: ${S3_ENDPOINT} # MinIO API 주소
        path-style-access-enabled: true # 버킷명을 주소의 경로에 넣는 것


# sqs는 이제 RabiitMQ로 대체
#      sqs:
#        queue:
#          name: ${AWS_QUEUE_NAME}

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_ADDRESS}
    password: ${GMAIL_PASSWORD}
    base-url: ${SERVER_URL:http://localhost:8080}/api/auth/verify?token=
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  forward-headers-strategy: framework

jwt:
  secret: ${JWT_SECRET_KEY}
  access-token-validity: ${JWT_ACCESS_TOKEN_VALIDITY}
  refresh-token-validity: ${JWT_REFRESH_TOKEN_VALIDITY}

firebase:
  enabled: ${FIREBASE_ENABLED:false}
  credentials-path: ${FIREBASE_CREDENTIALS_PATH:}


# OAuth2 소셜 로그인 설정
oauth2:
  naver:
    client-id: ${NAVER_CLIENT_ID}
    client-secret: ${NAVER_CLIENT_SECRET}
    redirect-uri: ${SERVER_URL}/api/auth/oauth2/callback/naver
  kakao:
    client-id: ${KAKAO_CLIENT_ID}
    client-secret: ${KAKAO_CLIENT_SECRET}
    redirect-uri: ${SERVER_URL}/api/auth/oauth2/callback/kakao
  google:
    client-id: ${GOOGLE_CLIENT_ID}
    client-secret: ${GOOGLE_CLIENT_SECRET}
    redirect-uri: ${SERVER_URL}/api/auth/oauth2/callback/google

management:
  endpoints:
    web:
      exposure:
        include: prometheus, health, info, metrics
  metrics:
    tags:
      application: nuvibe
    distribution:
      percentiles-histogram:
        http.server.requests: true

logging:
  file:
    name: /logs/application.log

frontend:
  url: ${FRONT_URL:http://localhost:3000}
app:
  image-processing:
    queue: ${IMAGE_PROCESSING_QUEUE:image.raw.uploaded}
    enabled: ${IMAGE_PROCESSING_ENABLED:true}