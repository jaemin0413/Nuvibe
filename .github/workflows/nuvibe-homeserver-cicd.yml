name: Home Server Connection Check

on:
  workflow_dispatch:

jobs:
  # jar 빌드 후 도커 이미지 게시
  build:
    name: Build and Push Image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.ref == 'refs/heads/dev'

    permissions:
      contents: read

    steps:
      # 저장소 접근
      - name: Checkout repository
        uses: actions/checkout@v4

      # 자바 및 gradle 설정
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle

      - name: Build executable JAR
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean bootJar
          test -s build/libs/nuvibe.jar

      # 도커 이미지 빌드
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 도커허브 로그인
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/nuvibe:sha-${{ github.sha }}

  # 이미지 게시 성공 후 홈서버 연결 확인
  connection:
    name: Verify Home Server Connection
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.ref == 'refs/heads/dev'

    permissions:
      contents: read
      # GitHub OIDC 인증 발급
      id-token: write

    steps:
      # 배포용 태그로 Tailscale에 임시 연결
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:nuvibe-ci

      # 호스트 키 검증 및 SSH 로그인
      - name: Verify Apps SSH connection
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: 100.66.12.112
          username: promevious
          port: 22
          key: ${{ secrets.NUVIBE_SSH_PRIVATE_KEY }}
          fingerprint: SHA256:fhMly2/oBnITaDynCpQJEFuT1oBpzpJmggxRvPnjYTM
          timeout: 30s
          command_timeout: 30s
          script: |
            set -eu
            hostname
            whoami
            docker --version
            docker compose version